<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Player</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
        h3 { margin: 0 0 10px 0; color: #4caf50; font-size: 16px; }
        .header { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn { background-color: #333; color: #fff; border: 1px solid #555; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-size: 16px; text-align: center; -webkit-appearance: none; appearance: none; }
        .btn:hover { background-color: #444; }
        .btn.hidden { display: none; }
        .btn-danger { background-color: #d32f2f; border-color: #b71c1c; }
        .btn-warning { background-color: #f57c00; border-color: #ef6c00; }
        select { background-color: #333; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 16px; }
        .main-layout { display: flex; gap: 15px; flex: 1; min-height: 0; }
        .column { background: #1e1e1e; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; min-width: 0; }
        .col-providers { flex: 0 0 150px; }
        .col-genres { flex: 0 0 200px; }
        .col-streams { flex: 1; }
        .col-video { flex: 1.5; min-width: 300px; }
        .list-container { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; max-height: 45vh; -webkit-overflow-scrolling: touch; }
        .list-item { background: #333; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; word-break: break-word; }
        .list-item:hover { background: #555; }
        .list-item.active { background: #0d6efd; border-color: #0d6efd; }
        video { width: 100%; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 8px; max-height: 40vh; }
        .video-controls { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .status { margin-top: 10px; font-weight: bold; color: #ffc107; min-height: 20px; font-size: 14px; }
        .info { margin-top: 10px; font-size: 12px; color: #aaa; word-break: break-all; white-space: pre-wrap; }
        .mac-cache-box { background: #2a2a2a; padding: 10px; border-radius: 4px; border-left: 4px solid #4caf50; margin-bottom: 10px; font-size: 13px; }
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .col-providers, .col-genres, .col-streams, .col-video { flex: 1 1 auto; width: 100%; }
            .col-video { order: -1; }
            .list-container { max-height: 35vh; }
            video { max-height: 30vh; }
        }
    </style>
</head>
<body>

    <div class="header">
        <select id="providerSelect" onchange="loadProviderData(this.value)">
            <option value="">Anbieter wählen...</option>
        </select>
        <button id="exportMacBtn" class="btn hidden" onclick="exportMacHistory()">Mac-Historie</button>
    </div>

    <div class="main-layout">
        <div class="column col-genres">
            <h3>Genres</h3>
            <div id="genreList" class="list-container"><div class="info">Bitte Anbieter wählen.</div></div>
        </div>
        <div class="column col-streams">
            <h3>Sender</h3>
            <div id="streamList" class="list-container"><div class="info">Wähle ein Genre...</div></div>
        </div>
        <div class="column col-video">
            <h3>Wiedergabe</h3>
            <div id="macCacheBox" class="mac-cache-box hidden">
                Aktive Mac: <span id="currentMacText" style="font-weight:bold; color:#fff;">-</span><br>
                <span style="font-size:11px; color:#888;">(Wird beibehalten, bis sie manuell gewechselt wird)</span>
            </div>
            <video id="videoElement" controls autoplay muted playsinline webkit-playsinline></video>
            <div class="video-controls">
                <button class="btn btn-danger" onclick="stopPlayback()">Stream stoppen</button>
                <button id="changeMacBtn" class="btn btn-warning hidden" onclick="changeMacAndReload()">Mac wechseln & neu verbinden</button>
            </div>
            <div id="statusMsg" class="status">Bereit.</div>
            <div id="streamInfo" class="info"></div>
        </div>
    </div>
