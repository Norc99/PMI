<!-- JAVASCRIPT LOGIK DES PLAYERS (Wird verschlüsselt) -->
<textarea id="playerJsTemplate" class="hidden-template">
const embeddedProviders = window.PROVIDER_DATA || {};
let player = null;
let parsedChannels = {}; 
let credentials = []; 
let baseUrl = "";
let currentProviderName = "";
let currentProviderType = "";
let currentStreamId = null;
let currentStreamName = null;
let activeCred = null;
let currentFinalUrl = ""; 
let vodProviders = []; 

let credRetries = 0;
const MAX_CRED_RETRIES = 5; 
let failedCreds = []; 
let loggingEnabled = false;
let isStopping = false;
let isStarting = false;
let vodCache = {};

let isSortedAZ = false;
let rawMediaList = []; 

function toggleLog() {
    loggingEnabled = document.getElementById('logToggle').checked;
    document.getElementById('logArea').style.display = loggingEnabled ? 'block' : 'none';
    if(loggingEnabled) log("Log aktiviert.");
}

function log(msg) {
    if (!loggingEnabled) return;
    const logArea = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();
    logArea.innerHTML += `[${time}] ${msg}\n`;
    logArea.scrollTop = logArea.scrollHeight;
}

window.addEventListener('DOMContentLoaded', () => {
    // BRANDINGS UBERSCHRIFT WIRD IN DEN HEADER EINGEFÜGT (verschüsselt)
    const header = document.querySelector('.header');
    if (header) {
        const branding = document.createElement('span');
        branding.innerText = 'html Webplayer by dierose';
        // Flexbox margin auto sorgt dafür, dass es mittig zwischen den Buttons und dem Log-Schalter sitzt
        branding.style.cssText = 'margin-left: auto; margin-right: auto; color: #4caf50; font-weight: bold; font-size: 16px; text-align: center;';
        
        // Füge es vor dem Log-Schalter ein, damit dieser rechts bleibt
        const logToggle = document.querySelector('.log-toggle');
        if (logToggle) {
            logToggle.style.marginLeft = '0'; // Überschreibt das margin-left: auto vom HTML, da das Branding es jetzt übernimmt
            header.insertBefore(branding, logToggle);
        } else {
            header.appendChild(branding);
        }
    }

    const select = document.getElementById('providerSelect');
    Object.keys(embeddedProviders).sort((a, b) => {
        if (a === 'Filme' || a === 'Serien') return 1;
        if (b === 'Filme' || b === 'Serien') return -1;
        return a.localeCompare(b);
    }).forEach(name => {
        let option = document.createElement('option');
        option.value = name;
        option.innerText = name;
        select.appendChild(option);
    });

    select.addEventListener('change', () => loadProviderData(select.value));
    document.getElementById('logToggle').addEventListener('change', toggleLog);
    document.getElementById('searchInput').addEventListener('input', renderMediaList);
    document.getElementById('sortBtn').addEventListener('click', toggleSortAZ);
    document.getElementById('stopBtn').addEventListener('click', stopPlayback);
    document.getElementById('changeCredBtn').addEventListener('click', () => changeCredAndReload());
    document.getElementById('openVlcBtn').addEventListener('click', openInVlc);
    document.getElementById('copyLinkBtn').addEventListener('click', copyStreamUrl);
    document.getElementById('exportCredBtn').addEventListener('click', exportCredHistory);
    document.getElementById('modalOverlay').addEventListener('click', closeModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalBox').addEventListener('click', (e) => e.stopPropagation());
});

function resetColumns() {
    document.getElementById('colSeasons').style.display = 'none';
    document.getElementById('colEpisodes').style.display = 'none';
    document.getElementById('mediaControls').classList.add('hidden');
    document.getElementById('searchInput').value = '';
    document.getElementById('mediaHeader').innerText = "Sender";
    rawMediaList = [];
}

function loadProviderData(providerName) {
    if (!providerName || !embeddedProviders[providerName]) return;
    currentProviderName = providerName;
    currentProviderType = embeddedProviders[providerName].type;
    
    failedCreds = []; 
    document.getElementById('statusMsg').innerText = `Lade ${providerName}...`;
    log(`Wechsle zu Anbieter: ${providerName} (Typ: ${currentProviderType})`);
    
    try {
        if (currentProviderType !== 'Filme' && currentProviderType !== 'Serien') {
            baseUrl = embeddedProviders[providerName].base_url;
            credentials = embeddedProviders[providerName].credentials;
        }
        
        if (credentials.length > 0 || currentProviderType === 'Filme' || currentProviderType === 'Serien') {
            
            if (credentials.length > 0) {
                activeCred = getOrGenerateCred(currentProviderName);
                log(`Aktiver Zugang gesetzt: ${formatCred(activeCred)}`);
                document.getElementById('credCacheBox').classList.remove('hidden');
                document.getElementById('currentCredText').innerText = formatCred(activeCred);
                document.getElementById('changeCredBtn').classList.remove('hidden');
                document.getElementById('exportCredBtn').classList.remove('hidden');
            } else {
                document.getElementById('credCacheBox').classList.add('hidden');
                document.getElementById('changeCredBtn').classList.add('hidden');
            }
            
            resetColumns();

            if (currentProviderType === 'Filme' || currentProviderType === 'Serien') {
                vodProviders = embeddedProviders[providerName].providers || []; 
                
                if (currentProviderType === 'Serien') {
                    document.getElementById('colSeasons').style.display = 'flex';
                    document.getElementById('colEpisodes').style.display = 'flex';
                }
                document.getElementById('mediaHeader').innerText = currentProviderType;
                document.getElementById('mediaControls').classList.remove('hidden');
                document.getElementById('statusMsg').innerText = `Lade ${currentProviderType}-Kategorien...`;
                document.getElementById('genreList').innerHTML = '<div class="info">Lade Kategorien...</div>';
                document.getElementById('streamList').innerHTML = '<div class="info">Wähle ein Genre...</div>';
                
                if (currentProviderType === 'Filme') loadAllMovieCategories();
                if (currentProviderType === 'Serien') loadAllSeriesCategories();
                return;
            }
            
            document.getElementById('mediaHeader').innerText = "Sender";
            document.getElementById('mediaControls').classList.remove('hidden');
            document.getElementById('statusMsg').innerText = `Anbieter geladen. (${credentials.length} Zugänge)`;
        } else {
            document.getElementById('statusMsg').innerText = `Anbieter geladen. (Achtung: Keine Zugänge gefunden!)`;
        }
        parsedChannels = parseM3U(embeddedProviders[providerName].m3u_data, currentProviderType);
        renderGenres();
    } catch (error) {
        document.getElementById('statusMsg').innerText = `Fehler: ${error.message}`;
        log(`FEHLER beim Laden: ${error.message}`);
    }
}

function toggleSortAZ() {
    isSortedAZ = !isSortedAZ;
    document.getElementById('sortBtn').innerText = isSortedAZ ? "Standard ⇄" : "A-Z ⇄";
    renderMediaList();
}

function renderMediaList() {
    const container = document.getElementById('streamList');
    container.innerHTML = '';
    
    if (!rawMediaList || rawMediaList.length === 0) {
        container.innerHTML = '<div class="info">Keine Einträge gefunden.</div>';
        return;
    }

    let list = [...rawMediaList]; 
    let searchTerm = document.getElementById('searchInput').value.toLowerCase();

    if (searchTerm) {
        list = list.filter(item => item.name.toLowerCase().includes(searchTerm));
    }

    if (isSortedAZ) {
        list.sort((a, b) => a.name.localeCompare(b.name));
    }

    if (list.length === 0) {
        container.innerHTML = '<div class="info">Keine Treffer.</div>';
        return;
    }

    list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        
        const span = document.createElement('span');
        span.innerText = item.name;
        span.onclick = () => item.onClick(item.raw_data, item.name, div);
        
        div.appendChild(span);

        if (currentProviderType === 'Filme' || currentProviderType === 'Serien') {
            const infoBtn = document.createElement('button');
            infoBtn.className = 'info-icon';
            infoBtn.innerText = 'i';
            infoBtn.onclick = (e) => {
                e.stopPropagation();
                showInfoModal(item.raw_data, item.name);
            };
            div.appendChild(infoBtn);
        }
        
        container.appendChild(div);
    });
}

async function showInfoModal(raw_id, name) {
    const modal = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const metaEl = document.getElementById('modalMeta');
    const descEl = document.getElementById('modalDesc');
    
    titleEl.innerText = name;
    metaEl.innerHTML = '';
    descEl.innerHTML = '<div class="modal-loading">Lade Beschreibung...</div>';
    modal.classList.add('active');

    try {
        const cleanId = String(raw_id).split('.')[0];
        const cacheKey = `${currentProviderName}_info_${cleanId}`;
        
        let data = vodCache[cacheKey];
        
        if (!data) {
            const action = currentProviderType === 'Filme' ? 'get_vod_info&vod_id=' : 'get_series_info&series_id=';
            const url = `${baseUrl}/player_api.php?username=${activeCred.user}&password=${activeCred.pass}&action=${action}${cleanId}`;
            log(`API Request (Info): ${url}`);
            const res = await fetch(url);
            data = await res.json();
            vodCache[cacheKey] = data;
        }

        const info = data.info || {};
        
        let metaHtml = '';
        if (info.duration) {
            let mins = Math.round(parseInt(info.duration) / 60);
            if (!isNaN(mins) && mins > 0) metaHtml += `<span>⏱️ Dauer: ${mins} Min</span>`;
        }
        if (info.genre) metaHtml += `<span>🎬 ${info.genre}</span>`;
        if (info.releasedate) {
            let year = String(info.releasedate).substring(0, 4);
            metaHtml += `<span>📅 Jahr: ${year}</span>`;
        }
        if (info.rating) metaHtml += `<span>⭐ ${info.rating}</span>`;
        
        let sizeBytes = 0;
        if (data.movie_data && data.movie_data.size) {
            sizeBytes = parseInt(data.movie_data.size);
        } else if (info.size) {
            sizeBytes = parseInt(info.size);
        }
        if (!isNaN(sizeBytes) && sizeBytes > 0) {
            let sizeMb = (sizeBytes / 1048576).toFixed(2);
            metaHtml += `<span>💾 Größe: ${sizeMb} MB</span>`;
        }

        metaEl.innerHTML = metaHtml || '<span>Keine Metadaten</span>';
        
        let plot = info.plot || info.description || "Keine Beschreibung verfügbar.";
        descEl.innerText = plot;
        
        let castHtml = '';
        if (info.cast) castHtml += `<div style="margin-top: 15px; font-size: 13px; color: #aaa;"><b>Schauspieler:</b> ${info.cast}</div>`;
        if (info.director) castHtml += `<div style="margin-top: 5px; font-size: 13px; color: #aaa;"><b>Regie:</b> ${info.director}</div>`;
        
        if (castHtml) {
            descEl.innerHTML += castHtml;
        }
        
    } catch (e) {
        descEl.innerText = "Fehler beim Laden der Daten.";
        log("FEHLER im Info Modal: " + e.message);
    }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

async function fetchXtreamData(action, catId) {
    let url = `${baseUrl}/player_api.php?username=${activeCred.user}&password=${activeCred.pass}&action=${action}`;
    if (catId) url += `&category_id=${catId}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
}

async function loadAllMovieCategories() {
    const container = document.getElementById('genreList');
    container.innerHTML = '';
    document.getElementById('streamList').innerHTML = '<div class="info">Wähle ein Genre...</div>';
    
    if (!vodProviders || vodProviders.length === 0) {
        container.innerHTML = '<div class="info">Keine Xtream-Anbieter gefunden.</div>';
        return;
    }
    
    for (let i = 0; i < vodProviders.length; i++) {
        const prov = vodProviders[i];
        currentProviderName = prov.name;
        baseUrl = prov.base_url;
        credentials = prov.credentials;
        activeCred = getOrGenerateCred(currentProviderName);
        
        if (i > 0) {
            const sep = document.createElement('div');
            sep.style = 'border-top: 1px solid #444; margin: 10px 0;';
            container.appendChild(sep);
        }
        
        const cacheKey = `${prov.name}_movie_cats`;
        let cats = vodCache[cacheKey];
        if (!cats) {
            try {
                const data = await fetchXtreamData('get_vod_categories');
                const filters = prov.vod_filters || ["DE "];
                cats = data.filter(cat => cat.category_name && filters.some(f => cat.category_name.toUpperCase().startsWith(f.toUpperCase())));
                vodCache[cacheKey] = cats;
            } catch (e) {
                log(`Fehler beim Laden von ${prov.name}: ${e.message}`);
                cats = [];
                const errDiv = document.createElement('div');
                errDiv.className = 'list-item';
                errDiv.style = 'background: #d32f2f; cursor: default; opacity: 0.7; text-align: center;';
                errDiv.innerHTML = `<span>⚠️ ${prov.name}: Fehler (geblockt?)</span>`;
                container.appendChild(errDiv);
                continue;
            }
        }
        
        cats.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${cat.category_name}</span>`;
            div.onclick = () => selectMovieCategory(i, cat.category_id, cat.category_name, div);
            container.appendChild(div);
        });
    }
    
    if (container.innerHTML === '') container.innerHTML = '<div class="info">Keine Kategorien gefunden.</div>';
    
    if (vodProviders.length > 0) {
        const firstProv = vodProviders[0];
        currentProviderName = firstProv.name;
        baseUrl = firstProv.base_url;
        credentials = firstProv.credentials;
        activeCred = getOrGenerateCred(currentProviderName);
        document.getElementById('credCacheBox').classList.remove('hidden');
        document.getElementById('currentCredText').innerText = formatCred(activeCred);
        document.getElementById('changeCredBtn').classList.remove('hidden');
    }

function formatCred(cred) {
    if (!cred) return "-";
    if (['xtream', 'Filme', 'Serien'].includes(currentProviderType)) return cred.user;
    return cred; 
}

function isSameCred(c1, c2) {
    if (!c1 || !c2) return false;
    if (['xtream', 'Filme', 'Serien'].includes(currentProviderType)) return c1.user === c2.user;
    return c1 === c2;
}

function isFailedCred(cred) { return failedCreds.some(fc => isSameCred(fc, cred)); }

function getOrGenerateCred(provider) {
    let storedCred = localStorage.getItem(`cred_cache_${provider}`);
    if (storedCred) {
        try {
            let parsed = JSON.parse(storedCred);
            if (credentials.some(c => isSameCred(c, parsed))) return parsed;
        } catch(e) {}
    }
    return getRandomCred();
}

function getRandomCred() {
    if (credentials.length === 0) return null;
    let newCred = null;
    let attempts = 0;
    do {
        newCred = credentials[Math.floor(Math.random() * credentials.length)];
        attempts++;
    } while ((isSameCred(newCred, activeCred) || isFailedCred(newCred)) && attempts < 20);
    localStorage.setItem(`cred_cache_${currentProviderName}`, JSON.stringify(newCred));
    addCredToHistory(currentProviderName, formatCred(newCred));
    return newCred;
}

function changeCredAndReload(isAutoRetry = false) {
    if (!credentials || credentials.length === 0) return;
    let oldCred = activeCred;
    if (isAutoRetry && activeCred) {
        failedCreds.push(activeCred);
        log(`Zugang ${formatCred(oldCred)} als gescheitert markiert.`);
    }
    let newCred = getRandomCred();
    activeCred = newCred;
    log(`Zugang rotiert: ${formatCred(oldCred)} -> ${formatCred(newCred)}`);
    document.getElementById('currentCredText').innerText = formatCred(activeCred);
    if(!isAutoRetry) document.getElementById('statusMsg').innerText = "Zugang gewechselt. Baue Stream neu auf...";
    if (currentStreamId) startPlayback(currentStreamId, currentStreamName, null, true);
}

function addCredToHistory(provider, credStr) {
    let history = JSON.parse(localStorage.getItem('cred_history') || '[]');
    history.push({ provider: provider, cred: credStr, date: new Date().toLocaleString() });
    localStorage.setItem('cred_history', JSON.stringify(history));
}

function exportCredHistory() {
    let history = JSON.parse(localStorage.getItem('cred_history') || '[]');
    if (history.length === 0) return alert("Noch keine Zugänge generiert.");
    let text = "Anbieter, Zugang, Datum/Uhrzeit\n====================================\n";
    history.forEach(entry => { text += `${entry.provider}, ${entry.cred}, ${entry.date}\n`; });
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zugang_history.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function startPlayback(streamId, name, element, isAutoRetry = false) {
    if (!streamId) return;
    if (isStarting && !isAutoRetry) { log("Doppelklick erkannt, Start ignoriert."); return; }
    isStarting = true;
    currentStreamId = streamId; 
    currentStreamName = name;
    if(!isAutoRetry) { credRetries = 0; failedCreds = []; }
    if(element) {
        document.querySelectorAll('.list-item.active').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }
    
    let finalUrl;
    let isVod = false;
    if (currentProviderType === 'Filme') {
        finalUrl = `${baseUrl}/movie/${activeCred.user}/${activeCred.pass}/${streamId}`;
        isVod = true;
    } else if (currentProviderType === 'Serien') {
        finalUrl = `${baseUrl}/series/${activeCred.user}/${activeCred.pass}/${streamId}`;
        isVod = true;
    } else if (currentProviderType === 'xtream') {
        finalUrl = streamId.replace("__X_USER__", activeCred.user).replace("__X_PASS__", activeCred.pass);
        if (!finalUrl.match(/\.(ts|m3u8|m3u)$/i)) { finalUrl += '.ts'; }
    } else {
        finalUrl = `${baseUrl}/play/live.php?mac=${activeCred}&stream=${streamId}&extension=ts`;
    }
    
    currentFinalUrl = finalUrl;
    document.getElementById('streamInfo').innerHTML = `Titel: ${name}<br>URL: <a href="${finalUrl}" title="Rechtsklick -> Ziel speichern unter..." target="_blank" style="color: #64b5f6; text-decoration: none;">${finalUrl}</a>`;
    document.getElementById('statusMsg').innerText = "Verbinde mit Stream...";
    log(`Starte Playback für ${name} | URL: ${finalUrl}`);
    
    document.getElementById('openVlcBtn').classList.remove('hidden');
    document.getElementById('copyLinkBtn').classList.remove('hidden');
    
    if (isVod) { playNativeVideo(finalUrl); } else { playMpegtsStream(finalUrl); }
}

function stopPlayback() {
    isStopping = true;
    isStarting = false;
    if (player) { player.destroy(); player = null; log("Player gestoppt und zerstört."); }
    const videoElement = document.getElementById('videoElement');
    videoElement.removeAttribute('src'); 
    videoElement.load();
    currentStreamId = null; currentStreamName = null; currentFinalUrl = "";
    document.querySelectorAll('.list-item.active').forEach(el => el.classList.remove('active'));
    document.getElementById('statusMsg').innerText = "Gestoppt.";
    document.getElementById('streamInfo').innerText = "";
    document.getElementById('openVlcBtn').classList.add('hidden');
    document.getElementById('copyLinkBtn').classList.add('hidden');
    setTimeout(() => { isStopping = false; }, 200);
}

function openInVlc() {
    if (!currentFinalUrl) return;
    const urlToOpen = currentFinalUrl;
    stopPlayback(); 
    
    const isWindows = navigator.platform.toUpperCase().indexOf('WIN') > -1;
    if (isWindows) {
        window.location.href = 'playvlc://' + encodeURIComponent(urlToOpen);
    } else {
        window.location.href = 'vlc://' + urlToOpen;
    }
}

function copyStreamUrl() {
    if (!currentFinalUrl) return;
    const urlToCopy = currentFinalUrl;
    stopPlayback();
    
    navigator.clipboard.writeText(urlToCopy).then(() => {
        document.getElementById('statusMsg').innerText = "Stream gestoppt. Link in Zwischenablage kopiert!";
    }).catch(err => {
        const ta = document.createElement('textarea');
        ta.value = urlToCopy;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); document.getElementById('statusMsg').innerText = "Stream gestoppt. Link kopiert!"; } catch (e) {}
        document.body.removeChild(ta);
    });
}

function playNativeVideo(url) {
    const videoElement = document.getElementById('videoElement');
    videoElement.volume = 0.5;
    if (player) { player.destroy(); player = null; }
    videoElement.src = url;
    videoElement.load();
    videoElement.onerror = function() {
        let err = videoElement.error;
        if (err) {
            log(`Natives Video Error - Code: ${err.code}`);
            if (err.code === MediaError.MEDIA_ERR_DECODE || err.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
                document.getElementById('statusMsg').innerText = "Codec-Fehler: Browser kann Datei nicht abspielen.";
            } else { document.getElementById('statusMsg').innerText = "Wiedergabefehler."; }
        }
    };
    videoElement.play().then(() => { isStarting = false; }).catch(err => {
        if(!isStopping && err.name !== 'AbortError') { document.getElementById('statusMsg').innerText = "Bitte auf das Video klicken, um zu starten."; }
        isStarting = false;
    });
}

function playMpegtsStream(url) {
    const videoElement = document.getElementById('videoElement');
    videoElement.volume = 0.5;
    if (mpegts.getFeatureList().mseLivePlayback) {
        if (player) player.destroy();
        const isLive = currentProviderType !== 'Filme' && currentProviderType !== 'Serien';
        player = mpegts.createPlayer({ type: 'mse', isLive: isLive, hasAudio: true, hasVideo: true, url: url }, {
            enableWorker: true, enableStashBuffer: false, stashInitialSize: 128, autoCleanupSourceBuffer: true
        });
        player.attachMediaElement(videoElement); 
        player.load();
        player.on(mpegts.Events.ERROR, function(errorType, errorDetail, errorInfo) {
            log(`MPEGTS ERROR - Type: ${errorType}, Detail: ${errorDetail}`);
            if (errorType === mpegts.ErrorTypes.NETWORK_ERROR) {
                if (credRetries < MAX_CRED_RETRIES) {
                    credRetries++;
                    isStarting = false;
                    document.getElementById('statusMsg').innerText = `Netzwerkfehler. Rotiere Zugang... (Versuch ${credRetries}/${MAX_CRED_RETRIES})`;
                    setTimeout(() => changeCredAndReload(true), 1500);
                } else {
                    document.getElementById('statusMsg').innerText = "Netzwerkfehler: Verbindung fehlgeschlagen.";
                    stopPlayback();
                }
            } else if (errorType === mpegts.ErrorTypes.MEDIA_ERROR) {
                document.getElementById('statusMsg').innerText = "Codec-Fehler: H.265 wird nicht unterstützt.";
                stopPlayback();
            } else {
                document.getElementById('statusMsg').innerText = `Stream Fehler: ${errorDetail}`;
                stopPlayback();
            }
        });
        videoElement.onerror = function() {
            let err = videoElement.error;
            if (err) {
                log(`VIDEO ELEMENT ERROR - Code: ${err.code}`);
                if (err.code === MediaError.MEDIA_ERR_DECODE || err.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
                    document.getElementById('statusMsg').innerText = "Codec-Fehler: H.265 wird nicht unterstützt.";
                    stopPlayback();
                }
            }
        };
        videoElement.play().then(() => { isStarting = false; }).catch(err => {
            if(!isStopping && err.name !== 'AbortError') { document.getElementById('statusMsg').innerText = "Bitte auf das Video klicken, um zu starten."; }
            isStarting = false;
        });
    } else {
        document.getElementById('statusMsg').innerText = "Browser unterstützt kein MSE. Versuche nativen Player...";
        playNativeVideo(url);
    }
}

function parseM3U(text, providerType) {
    const lines = text.split('\n');
    const channels = {};
    let currentChannel = null;
    for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF')) {
            const groupMatch = line.match(/group-title="([^"]+)"/);
            const nameMatch = line.match(/,(.*)$/);
            let group = groupMatch ? groupMatch[1] : "Sonstige";
            let name = nameMatch ? nameMatch[1] : "Unbekannt";
            currentChannel = { group, name, url: null, streamId: null };
        } else if (line.startsWith('http') && currentChannel) {
            currentChannel.url = line;
            if (providerType === 'xtream') {
                currentChannel.streamId = line; 
            } else {
                const idMatch = line.match(/_(\d+)/);
                if (idMatch) currentChannel.streamId = idMatch[1];
            }
            if (!channels[currentChannel.group]) channels[currentChannel.group] = [];
            channels[currentChannel.group].push(currentChannel);
            currentChannel = null;
        }
    }
    return channels;
}
